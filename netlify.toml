[build]
  publish = "."
  edge_functions = "netlify/edge-functions"

# Edge function for image hotlink protection
[[edge_functions]]
  function = "image-protection"
  path = "/assets/*"

[[edge_functions]]
  function = "image-protection"
  path = "/*.jpg"

[[edge_functions]]
  function = "image-protection"
  path = "/*.jpeg"

[[edge_functions]]
  function = "image-protection"
  path = "/*.png"

[[edge_functions]]
  function = "image-protection"
  path = "/*.webp"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'none'"

# Prevent hotlinking of images
[[headers]]
  for = "/assets/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=31536000, immutable"

# Block direct image access without referer (anti-hotlinking)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    X-Robots-Tag = "noimageindex"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    X-Robots-Tag = "noimageindex"

[[headers]]
  for = "/*.png"
  [headers.values]
    X-Robots-Tag = "noimageindex"

[[headers]]
  for = "/*.webp"
  [headers.values]
    X-Robots-Tag = "noimageindex"
